[project]
name = "industrial-llm-learning"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cnc_assistant"]